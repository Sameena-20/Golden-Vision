{%extends 'public/base.html'%}

{%load static%}


{%block title%}New Password{%endblock%}

{%block content%}

    <div
      class="hero page-inner overlay"
      style="background-image: url('/static/images/login_img.jpeg')"
    >
      <div class="container">
        <div class="row justify-content-center align-items-center">
          <div class="col-lg-9 text-center mt-5">
            <h1 class="heading" data-aos="fade-up">New Password</h1>

            <nav
              aria-label="breadcrumb"
              data-aos="fade-up"
              data-aos-delay="200"
            >
              <ol class="breadcrumb text-center justify-content-center">
                <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
                <li
                  class="breadcrumb-item active text-white-50"
                  aria-current="page"
                >
                  New Password
                </li>
              </ol>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <img src="{% static 'images/new_password.jpeg' %}" alt="Lock" class="lock-icon">
            <h3>New Password</h3>

            {% if messages %}
                {% for message in messages %}
                    <div class="messages">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'new_password' %}">
                {% csrf_token %}
                <input type="hidden" name="email" value="{{ email }}">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Enter your new password" required>
                </div>
                <br><br><br>
                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>
        </div>
    </div>

{%endblock%}
