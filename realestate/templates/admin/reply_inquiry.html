{%extends 'admin/admin_base.html'%}

{%load static%}


{%block title%}Reply Inquiry{%endblock%}

{%block content%}


<div class="hero page-inner overlay" style="background-image: url('/static/images/admin_home.jpeg')">
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-9 text-center mt-5">
                <h1 class="heading text-white">Reply Inquiry</h1>
            </div>
        </div>
    </div>
</div>

<div class="section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-lg p-5 rounded-4 border-0">
                    <h3 class="text-center mb-4 text-primary fw-bold">Reply to Inquiry</h3>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-semibold" *>Reply *</label>
                                <textarea name="reply" class="form-control" rows="5" required></textarea>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary px-4 py-2">Send Reply</button>
                                <a href="{% url 'manage_inquiries' %}" class="btn btn-secondary px-4 py-2">
                                    Cancel
                                </a>
                            </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
